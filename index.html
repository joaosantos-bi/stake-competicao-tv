<style>
:root{--bg:#0C0E2A;--paper:#F4F7FA;--surface:#FFFFFF;--sunk:#E9EEF4;--ink:#262A2E;--heading:#1B1F59;--muted:#566074;--line:#D9E0E8;
  --navy:#1B1F59;--teal:#20E3C9;--teal-ink:#0A7D6F;--teal-soft:#E1FAF6;--on-dark:#F4F7FB;--on-dark-2:#C9D2E3;--good:#12805C;--bad:#B4322B;--warn:#9A5B00;

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--body);color:var(--ink)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05}
p{margin:0}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:var(--paper)}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .8s ease}
.slide.on{opacity:1}
.head{position:relative;overflow:hidden;background:linear-gradient(135deg,#10133A 0%,#1B1F59 62%,#173F6B 100%);color:var(--on-dark);padding:36px 64px 40px;display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.head .v{position:absolute;right:-30px;top:-40px;width:380px;opacity:.2}
.brand{position:absolute;left:64px;top:30px;display:flex;align-items:center;gap:22px}
.brand img{height:40px}.brand .stk{filter:invert(1)}.brand i{width:1px;height:32px;background:rgba(255,255,255,.3)}
.titles{margin-top:64px;display:flex;flex-direction:column;gap:10px;position:relative}
.eyebrow{font-size:20px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--teal)}
.titles h1{font-size:68px;font-weight:700}
.titles h1 span{color:var(--teal)}
.chips{display:flex;gap:16px;position:relative}
.chip{background:rgba(255,255,255,.08);border:1px solid rgba(32,227,201,.4);border-radius:20px;padding:16px 24px;display:flex;flex-direction:column;gap:4px;min-width:220px}
.chip small{font-size:15px;font-weight:700;letter-spacing:.16em;color:var(--on-dark-2)}
.chip b{font:800 38px var(--display)}
.chip span{font-size:17px;color:var(--on-dark-2)}
.chip.hot{background:var(--teal);color:#10133A;border-color:var(--teal)}.chip.hot small,.chip.hot span{color:#10133A}
.body{flex:1;padding:28px 64px 0;display:flex;flex-direction:column;gap:22px;min-height:0}
.banner{background:#FBEFD9;color:#6E4300;border-radius:14px;padding:12px 20px;font-size:19px}
.banner b{font-size:14px;letter-spacing:.14em;margin-right:12px}
.row{display:flex;gap:22px;min-height:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 26px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:30px;color:var(--heading)}
.card .sub{font-size:17px;color:var(--muted)}
.kpi{border-top:7px solid var(--teal);flex:1}
.kpi small{font-size:15px;font-weight:700;letter-spacing:.16em;color:var(--muted)}
.kpi b{font:800 46px/1 var(--display);color:var(--heading)}
.kpi span{font-size:18px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:12px;height:175px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bars i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--navy)}
.bars i.last{background:var(--teal)}
.bars em{font-style:normal;font:700 19px var(--display);color:var(--teal-ink)}
.bars span{font-size:16px;color:var(--muted)}
.daily{display:grid;gap:2px;align-items:end;flex-shrink:0}
.daily i{display:block;border-radius:2px 2px 0 0;background:var(--navy)}
.dailyF{display:grid;gap:2px;align-items:start;flex-shrink:0}
.dailyF i{display:block;border-radius:0 0 2px 2px;background:var(--teal-ink)}
.lbl{font-size:14px;font-weight:700;letter-spacing:.14em}
.geos{display:grid;grid-template-columns:repeat(7,1fr);gap:16px}
.geo{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.geo .t{display:flex;align-items:center;gap:8px}
.flag{height:26px;width:39px;object-fit:cover;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,.25);flex:none}
.gr h3 .flag{margin-right:10px;vertical-align:-4px}
.iso{font:800 14px var(--display);background:var(--teal);color:#10133A;border-radius:6px;padding:3px 7px}
.geo h3{font-size:22px;color:var(--heading)}
.geo b{font:800 30px var(--display);color:var(--heading)}
.geo span{font-size:14px;color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:3px;height:36px}.spark i{flex:1;background:#C9D2E3;border-radius:2px}.spark i.last{background:var(--teal)}
.podium{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:22px;align-items:end}
.pod{border-radius:26px;padding:28px 32px;display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 18px 40px rgba(27,31,89,.14)}
.pod.first{background:linear-gradient(135deg,#10133A 0%,#1B1F59 62%,#173F6B 100%);color:var(--on-dark);border:0;min-height:360px}
.pod .top{display:flex;justify-content:space-between;align-items:center}
.medal{width:64px;height:64px;border-radius:32px;display:flex;align-items:center;justify-content:center;font:800 30px var(--display);color:#10133A}
.pod .prize{font:800 30px var(--display);color:var(--teal-ink)}.pod.first .prize{color:var(--teal)}
.pod .nm{font:700 38px var(--display)}
.pod .meta{font-size:19px;opacity:.8}
.pod .big{font:800 84px/1 var(--display)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:60px 1.4fr 110px 2fr 120px 190px;gap:18px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--sunk);font-size:21px}
.li .r{font:800 24px var(--display);color:var(--muted)}
.li .n{font-weight:700;color:var(--heading)}
.li .tm{font-size:16px;font-weight:700;background:var(--sunk);color:var(--heading);border-radius:6px;padding:3px 8px;justify-self:start}
.li .bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--paper)}
.li .bar i:first-child{background:var(--teal)}.li .bar i:last-child{background:#C9D2E3}
.li .v{text-align:right;font:800 26px var(--display);color:var(--heading)}
.li .gap{text-align:right;font-size:17px;font-weight:700;color:var(--warn)}
.ggrid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:18px;flex:1;min-height:0}
.gr{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-height:0}
.gr .t{display:flex;justify-content:space-between;align-items:center}
.gr h3{font-size:25px;color:var(--heading);display:flex;gap:8px;align-items:center}
.gr .cpp{font-size:15px;color:var(--muted)}
.gl{display:grid;grid-template-columns:30px 1fr 96px 70px;gap:10px;align-items:center;font-size:16px}
.gl .rk{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font:800 15px var(--display);background:var(--sunk);color:var(--muted)}
.gl .rk.ok{background:var(--teal);color:#10133A}
.gl .nm{font-weight:700;color:var(--heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl .pt{text-align:right;font:800 18px var(--display);color:var(--heading)}
.gl .pz{text-align:right;font:700 16px var(--display);color:var(--teal-ink)}
.gl .pz.no{color:var(--warn);font-size:13px}
.gl .track{grid-column:2/5;height:8px;background:var(--paper);border-radius:4px;position:relative;margin-top:-4px}
.gl .track i{display:block;height:8px;border-radius:4px;background:linear-gradient(90deg,#1B1F59,#20E3C9)}
.gl .track i.no{background:#C9D2E3}
.gl .track b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--navy)}
.empty{font-size:17px;color:var(--muted);font-style:italic}
.rules{background:var(--navy);color:var(--on-dark-2);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;font-size:17px;line-height:1.45}
.rules b{color:var(--teal)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 64px 22px;font-size:15px;color:#7A8394}
.notes{display:flex;gap:30px;max-width:1450px}
.notes p{flex:1}
.dots{display:flex;gap:10px;align-items:center}
.dots i{width:12px;height:12px;border-radius:6px;background:#C9D2E3}.dots i.on{background:var(--teal-ink);width:36px}
#prog{position:absolute;left:0;bottom:0;height:6px;background:var(--teal);width:0}
.tabs{display:flex;gap:8px}.tabs span{font-size:14px;font-weight:700;letter-spacing:.08em;padding:6px 12px;border-radius:12px;color:#7A8394;background:var(--sunk)}.tabs span.on{background:var(--teal-ink);color:#fff}
.ov{display:grid;grid-template-columns:1fr 1.9fr;gap:22px;flex:1;min-height:0}
.mrow{display:grid;grid-template-columns:56px 1fr auto;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--sunk)}
.medal.s{width:52px;height:52px;font-size:24px}
.mrow .nm{font:700 30px var(--display);color:var(--heading)}.mrow .meta{font-size:18px;color:var(--muted)}
.mrow .v{font:800 46px/1 var(--display);color:var(--heading);text-align:right}.mrow .v small{display:block;font:700 15px var(--body);color:var(--teal-ink);margin-top:4px}
.lead{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:16px;flex:1;min-height:0}
.lt{background:var(--paper);border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lt .t{display:flex;gap:8px;align-items:center}.lt h3{font-size:20px;color:var(--heading)}
.lt .nm{font:700 25px var(--display);color:var(--heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt b{font:800 28px var(--display);color:var(--teal-ink)}.lt span{font-size:15px;color:var(--muted)}
.lt.sum{background:var(--navy);justify-content:center}.lt.sum small{font-size:14px;font-weight:700;letter-spacing:.14em;color:var(--on-dark-2)}.lt.sum b{font-size:44px;color:var(--teal)}.lt.sum span{color:var(--on-dark-2)}
.slots{display:flex;gap:5px;margin-top:auto}.slots i{flex:1;height:8px;border-radius:4px;background:#C9D2E3}.slots i.ok{background:var(--teal)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.how div{background:var(--navy);color:var(--on-dark-2);border-radius:20px;padding:18px 24px;font-size:18px;line-height:1.45}
.how h3{color:var(--teal);font-size:22px;margin-bottom:6px}

/* ===== Clever TV structure (same as the Clever Boards TV): header band, period + 2-line comment, KPI labels, footer ===== */
.head{padding:20px 64px;min-height:132px;align-items:center}
.head .v{width:240px;top:-60px}
.hl{display:flex;align-items:center;gap:28px;position:relative;z-index:1;min-width:0}

.mrow .v{font-size:52px}.pod .big{font-size:80px}
.foot p{margin:0}
.gr .t{flex-direction:column;align-items:flex-start;gap:2px}
.gr h3{font-size:24px;white-space:nowrap}
.gr .cpp{font:700 13px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--teal-ink)}
.lt .t h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>

const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MF = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const PAGES = ['Overall', 'Master', 'Geos'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const big = n => n >= 1e6 ? (n/1e6).toFixed(1) + 'M' : n >= 1e4 ? Math.round(n/1e3) + 'k' : fmt(n);
const eur = n => '€' + n.toFixed(2);
const pct = (a,b) => b ? Math.round((a/b-1)*100) : 0;
const sgn = p => (p>0?'+':p<0?'−':'') + Math.abs(p) + '%';
const mname = m => MN[+m.slice(5,7)-1];
const mfull = m => MF[+m.slice(5,7)-1];
function main(D) {
const P = D.prizes, preview = D.mode === 'preview';
const ORDER = ['CA','AR','PH','DK','LU','NZ','AL'];
// a geo with no qualifying traffic yet has no ranking entry: show it empty instead of breaking the page
const GN = Object.fromEntries((D.geos||[]).map(g => [g.id, g]));
ORDER.forEach(iso => { if (!D.ranking[iso]) D.ranking[iso] = {name: (GN[iso]||{}).name || iso, cpp: (GN[iso]||{}).cpp || 0, n: 0, rows: []}; });

function header(eyebrow, question, chips) {
  return `<div class="head">${V}<div class="hl"><img class="clv" src="${CLEVER}" alt="Clever Advertising"><i></i><img class="stk" src="${STAKE}" alt="Stake">
    <div class="titles"><span class="eyebrow">${eyebrow}</span><h1>${question}</h1></div></div>
    <div class="chips">${chips.slice(0,2).map(c => `<div class="chip ${c.hot?'hot':''}"><small>${c.k}</small><b>${c.v}</b><span>${c.s}</span></div>`).join('')}</div></div>`;
}
// period line + comment in two sentences (first sentence on line 1, second on line 2), as on the Clever TV
function intro(l1, l2) {
  const period = preview ? `Example | ${mfull(D.lastMonth)} data` : `9 Nov 2026 – 1 Feb 2027 | Day ${D.day} of ${D.daysTotal} | new deals only`;
  return `<div class="hd"><div class="period">${period}</div><div class="verdict">${l1}${l2 ? `<span class="l2">${l2}</span>` : ''}</div></div>`;
}
function foot(i) {
  return `<div class="foot"><p>Fingerprint costs are confirmed at month-end, so costs, CPM and points may still change. FTDs are final between 1 and 15 Mar 2027; rankings are provisional until then.</p>
    <div style="display:flex;gap:22px;align-items:center"><span style="white-space:nowrap">Updated ${esc(D.built)}</span>
    <div class="tabs">${PAGES.map((p,k) => `<span class="${k===i?'on':''}">${p}</span>`).join('')}</div></div></div>`;
}
const banner = preview ? `<div class="banner"><b>EXAMPLE</b>${mfull(D.lastMonth)} data, new deals of ${mfull(D.lastMonth)} only. Shown until the race has its first results.</div>` : '';
const timeChip = D.daysToStart > 0 ? {k:'STARTS IN', v:D.daysToStart + (D.daysToStart===1?' day':' days'), s:'9 Nov – 1 Feb'}
                                   : {k:'DAY', v:`${D.day} of ${D.daysTotal}`, s:'9 Nov 2026 – 1 Feb 2027'};
const dayTag = D.daysToStart > 0 ? `Starts in ${D.daysToStart} days` : `Day ${D.day} of ${D.daysTotal}`;
const medals = ['#20E3C9', '#C9D2E3', '#E9C9A6'];
const qualified = iso => D.ranking[iso].rows.filter(r => r.p >= P.min).length;

// ---- 1. Overall
(function(){
  const M = D.master.slice(0,3), spots = ORDER.reduce((a,iso) => a + qualified(iso), 0);
  const lead = iso => { const g = D.ranking[iso], r = g.rows[0], q = qualified(iso);
    return `<div class="lt"><div class="t"><img class="flag" src="https://flagcdn.com/${iso.toLowerCase()}.svg" alt="" onerror="this.remove()"><span class="iso">${iso}</span><h3>${esc(g.name)}</h3></div>
      ${r ? `<span class="nm">${esc(r.n)}</span><b>${big(r.p)} pts</b>` : '<span class="empty">No leader yet</span>'}
      <div class="slots">${[0,1,2,3,4].map(k => `<i class="${k<q?'ok':''}"></i>`).join('')}</div><span>${q} of 5 prize spots taken</span></div>`; };
  const m1 = D.master[0];
  document.getElementById('s1').innerHTML = header(`Stake Race | ${dayTag}`, 'Who is leading the race?',
    [{...timeChip, hot:true}, {k:'PRIZE POOL', v:'€14,000', s:'€3,500 Master | €10,500 geos'}]) +
  `<div class="body">${banner}
    ${intro(m1 ? `<b>${esc(m1.n)}</b> leads the Master prize with <b>${m1.v}</b> valid FTD${m1.v===1?'':'s'}.` : 'No valid FTDs from new deals yet.',
           `<b>${spots} of 35</b> geo prize spots are taken (min. ${fmt(P.min)} points).`)}
    <div class="ov">
      <div class="card"><h2>Master prize</h2><span class="sub">Most valid FTDs from new deals</span>
        ${M.length ? M.map((m,i) => `<div class="mrow"><span class="medal s" style="background:${medals[i]}">${i+1}</span>
          <div><div class="nm">${esc(m.n)}</div><div class="meta">Team ${esc(m.t)} | €${fmt(P.master[i])}</div></div>
          <div class="v">${m.v}<small>valid FTDs</small></div></div>`).join('') : '<p class="empty">No FTDs on new deals yet.</p>'}</div>
      <div class="card"><h2>Geo prizes | leaders</h2><span class="sub">Number 1 in each geo by points</span>
        <div class="lead">${ORDER.map(lead).join('')}
          <div class="lt sum"><small>PRIZE SPOTS TAKEN</small><b>${spots} / 35</b><span>Spots need at least ${fmt(P.min)} points</span></div></div></div>
    </div>
    <div class="how">
      <div><h3>Master | €3,500</h3>The 3 media buyers with the most FTDs from new deals. FTDs only count within the geo's max CPP. €2,000 | €1,000 | €500.</div>
      <div><h3>Geo prizes | up to €10,500</h3>Points = viewable impressions ÷ CPM. Top 5 per geo with ${fmt(P.min)}+ points: €500 | €400 | €300 | €200 | €100.</div>
      <div><h3>The rules</h3>Only new deals count: a lead's first Deal, or a Deal after Lost Lead, between 9 Nov and 1 Feb (Suspended back to Deal doesn't count). Their Stake traffic counts cumulatively, to the last day.</div>
    </div>
  </div>` + foot(0);
})();

// ---- 2. Master
(function(){
  const M = D.master, looks = ['first', '', ''];
  const third = M[2] ? M[2].v : 0, maxF = Math.max(...M.map(m => m.f), 1);
  const geoName = Object.fromEntries(D.geos.map(g => [g.id, g.name]));
  const geos = g => g.map(x => geoName[x]).join(', ') || '—';
  const L = M[0], gap2 = L ? L.v - (M[1] ? M[1].v : 0) : 0;
  document.getElementById('s2').innerHTML = header(`Master prize €3,500 | ${dayTag}`, 'Who has the most valid FTDs?',
    [L ? {k:'LEADER', v:esc(L.n), s:`${L.v} valid FTD${L.v===1?'':'s'}`, hot:true} : {...timeChip, hot:true}, {k:'PRIZES', v:'€2,000', s:'€1,000 2nd | €500 3rd'}]) +
  `<div class="body">${banner}
    ${intro(L ? `<b>${esc(L.n)}</b> leads with <b>${L.v}</b> valid FTD${L.v===1?'':'s'}, ${gap2} ahead of 2nd.` : 'No valid FTDs from new deals yet.',
           L ? `3rd place (€500) is held with <b>${third}</b> valid FTD${third===1?'':'s'}.` : '')}
    ${M.length ? `<div class="podium">${M.slice(0,3).map((m,i) => `<div class="pod ${looks[i]}"><div class="top"><span class="medal" style="background:${medals[i]}">${i+1}</span><span class="prize">€${fmt(P.master[i])}</span></div>
      <div><div class="nm">${esc(m.n)}</div><div class="meta">Team ${esc(m.t)} | ${m.d} new deal${m.d===1?'':'s'} | ${esc(geos(m.g))}</div></div>
      <div style="display:flex;align-items:baseline;gap:14px"><span class="big">${m.v}</span><span class="meta">valid FTDs (${m.f} in total)</span></div></div>`).join('')}</div>
    <div class="card" style="overflow:hidden"><div class="list">${M.slice(3,6).map((m,i) => `<div class="li"><span class="r">${i+4}</span><span class="n">${esc(m.n)}</span><span class="tm">${esc(m.t)}</span>
      <span class="bar"><i style="width:${m.v/maxF*100}%"></i><i style="width:${(m.f-m.v)/maxF*100}%"></i></span><span class="v">${m.v}</span><span class="gap">${third-m.v} behind 3rd</span></div>`).join('')}</div></div>`
    : `<div class="card"><p class="empty">No FTDs on new deals yet.</p></div>`}
    <div class="rules"><span><b>Valid FTD:</b> an FTD from a new deal that comes in within the geo's max CPP. Volume alone won't win this: it has to be efficient volume. Bar: teal = valid, grey = above max CPP.</span></div>
  </div>` + foot(1);
})();

// ---- 3. Geos
(function(){
  const card = iso => { const g = D.ranking[iso]; const mx = Math.max(P.min*1.2, ...g.rows.map(r => r.p));
    const thr = P.min/mx*100;
    const rows = g.rows.length ? g.rows.map((r,i) => { const ok = r.p >= P.min;
      return `<div class="gl"><span class="rk ${ok?'ok':''}">${i+1}</span><span class="nm">${esc(r.n)}</span><span class="pt">${big(r.p)}</span>
        <span class="pz ${ok?'':'no'}">${ok ? '€'+P.geo[i] : 'needs '+(P.min-r.p >= 1000 ? Math.ceil((P.min-r.p)/1e3)+'k' : fmt(P.min-r.p))}</span>
        <span class="track"><i class="${ok?'':'no'}" style="width:${Math.max(1,r.p/mx*100)}%"></i><b style="left:${thr}%"></b></span></div>`; }).join('')
      : '<p class="empty">No qualifying traffic yet.</p>';
    return `<div class="gr"><div class="t"><h3><img class="flag" src="https://flagcdn.com/${iso.toLowerCase()}.svg" alt="" onerror="this.remove()"><span class="iso">${iso}</span>${esc(g.name)}</h3><span class="cpp">Max CPP €${g.cpp} | ${g.n} buyer${g.n===1?'':'s'}</span></div>${rows}</div>`; };
  const spots = ORDER.reduce((a,iso) => a + qualified(iso), 0);
  const best = ORDER.map(iso => ({iso, q: qualified(iso), name: D.ranking[iso].name})).sort((a,b) => b.q - a.q)[0];
  document.getElementById('s3').innerHTML = header(`Geo prizes up to €10,500 | ${dayTag}`, 'Who leads each geo?',
    [{k:'PRIZE SPOTS TAKEN', v:`${spots} / 35`, s:`min. ${fmt(P.min)} points`, hot:true}, {k:'POINTS', v:'VI ÷ CPM', s:'€500 to €100 per geo'}]) +
  `<div class="body">${banner}
    ${intro(`<b>${spots} of 35</b> prize spots are taken: a spot needs at least ${fmt(P.min)} points.`,
           best && best.q ? `<b>${esc(best.name)}</b> has the most buyers in the prizes (${best.q} of 5).` : 'No buyer has reached the minimum yet.')}
    <div class="ggrid">${ORDER.map(card).join('')}
      <div class="rules"><span><b>Points</b> = viewable impressions ÷ CPM, per month, added up.</span>
        <span><b>Prizes:</b> top 5 per geo with at least ${fmt(P.min)} points win €500, €400, €300, €200 and €100.</span>
        <span>The line on each bar marks ${fmt(P.min)} points.</span></div>
    </div>
  </div>` + foot(2);
})();
}

// ---- stage fit + rotation + reload
function fit(){ const s = Math.min(innerWidth/1920, innerHeight/1080); document.getElementById('stage').style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();
const slides = [...document.querySelectorAll('.slide')], prog = document.getElementById('prog');
let cur = Math.min(slides.length - 1, Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
function show(i){ slides.forEach((s,k) => s.classList.toggle('on', k===i)); prog.style.transition = 'none'; prog.style.width = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => { prog.style.transition = `width ${ROTATE}ms linear`; prog.style.width = '100%'; })); }
// data.json (refreshed by the scheduled job) wins over the copy embedded at build time
fetch(DATA_URL + '?t=' + Date.now(), {cache: 'no-store'}).then(r => r.ok ? r.json() : Promise.reject()).catch(() => EMBEDDED).then(d => { main(d); show(cur); });
setInterval(() => { cur = (cur+1) % slides.length; show(cur); }, ROTATE);
setTimeout(() => location.reload(), 30*60*1000);
</script>
</body>
</html>
